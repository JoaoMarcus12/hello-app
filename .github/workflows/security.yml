name: Verificações de Segurança

on:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks - Detecção de Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Executar Gitleaks
        run: gitleaks detect --source . --verbose --redact

  sonarcloud:
    name: SonarCloud - Análise Estática (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy - Varredura de Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem para varredura
        run: docker build -t hello-app:pr .

      - name: Trivy - varredura de dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Trivy - bloquear vulnerabilidades CRITICAL e HIGH com correção
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-app:pr
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy - registrar vulnerabilidades LOW e MEDIUM
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-app:pr
          format: json
          output: trivy-report.json
          severity: LOW,MEDIUM

      - name: Publicar relatório LOW/MEDIUM como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-low-medium
          path: trivy-report.json

  syft:
    name: Syft - Geração de SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem para SBOM
        run: docker build -t hello-app:pr .

      - name: Gerar SBOM
        uses: anchore/sbom-action@v0
        with:
          image: hello-app:pr
          artifact-name: sbom.spdx.json
          format: spdx-json
          upload-artifact: true
