name: Security Checks

on:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  sonarcloud:
    name: SonarCloud - SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy - Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t hello-app:pr .

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Trivy image scan - block on CRITICAL/HIGH with fix
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-app:pr
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy image scan - report LOW/MEDIUM
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-app:pr
          format: json
          output: trivy-report.json
          severity: LOW,MEDIUM

      - name: Upload Trivy LOW/MEDIUM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-low-medium-report
          path: trivy-report.json

  syft:
    name: Syft - Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for SBOM
        run: docker build -t hello-app:pr .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: hello-app:pr
          artifact-name: sbom.spdx.json
          format: spdx-json
          upload-artifact: true
